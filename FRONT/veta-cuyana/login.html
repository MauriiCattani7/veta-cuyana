<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ingresar | Veta Cuyana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="apg">

<button class="round apt" id="theme" aria-label="Cambiar tema claro u oscuro"></button>

<main class="ap">
  <a class="logo" href="login.html">
    <i><svg viewBox="0 0 24 24"><path d="M3 17h18M5 17a7 7 0 0 1 14 0M12 6v4M8 8l1.5 2.5M16 8l-1.5 2.5"/></svg></i>
    <div><b>Veta<span>Cuyana</span></b><small>Portal de vacantes mineras</small></div>
  </a>

  <section class="apc">
    <h1 id="at">Ingresar</h1>
    <p class="hint" id="ah"></p>

    <div class="seg" role="tablist" aria-label="Tipo de cuenta" id="segr">
      <button type="button" role="tab" data-r="persona"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Soy persona</button>
      <button type="button" role="tab" data-r="empresa"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 8h2M13 8h2M9 12h2M13 12h2M10 21v-4h4v4"/></svg>Soy empresa</button>
    </div>

    <form id="af">
      <label data-v="reg persona">Nombre completo<input id="an" autocomplete="name" placeholder="Mario Gómez"></label>
      <label data-v="reg empresa">Razón social<input id="arz" autocomplete="organization" placeholder="Minera Altiplano S.A."></label>
      <div class="two" data-v="reg empresa">
        <label>CUIT<input id="acu" inputmode="numeric" placeholder="30-12345678-9"></label>
        <label>Persona de contacto<input id="apc" autocomplete="name" placeholder="Nombre y apellido"></label>
      </div>
      <label data-v="reg persona">WhatsApp<input id="aw" type="tel" autocomplete="tel" placeholder="+54 9 261 000 0000"></label>

      <label>Correo<input id="ae" type="email" required autocomplete="email" placeholder="correo@ejemplo.com"></label>
      <label>Contraseña<input id="ap" type="password" required minlength="8" autocomplete="current-password" placeholder="Mínimo 8 caracteres"></label>
      <label data-v="reg">Repetir contraseña<input id="ap2" type="password" autocomplete="new-password" placeholder="Repetí la contraseña"></label>
      <label class="chk" data-v="reg"><input id="at2" type="checkbox"><span>Acepto los términos y la política de privacidad.</span></label>

      <p class="err" id="aerr" role="alert" hidden></p>
      <button class="btn pri big2" type="submit" id="asb">Ingresar</button>
    </form>
    <p class="hint sw" id="asw"></p>
  </section>
</main>

<div id="toast" role="status"></div>

<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script src="js/login.js"></script>
</body>
</html>
